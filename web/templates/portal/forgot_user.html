{{define "body"}}
<main class="grid min-h-screen place-items-center p-4">
  <div class="card w-full max-w-sm overflow-hidden">
    <div class="fiber-stripe" aria-hidden="true"></div>
    <div class="card-body space-y-4">
      <h1 class="text-2xl font-semibold">{{T "Forgot Usernames"}}</h1>
      {{if .Flash}}<p class="alert alert-ok" role="status">{{icon "circle-check"}}<span>{{.Flash}}</span></p>{{end}}
      {{if .Error}}<p class="alert alert-error" role="alert">{{icon "circle-alert"}}<span>{{T .Error}}</span></p>{{end}}
      <form method="post" action="/portal/forgot/username" class="space-y-4">
        <div><label class="label" for="contact">{{T "Email or Phone Number"}}</label>
          <input class="input" id="contact" name="contact" autocomplete="email" required autofocus></div>
        <button class="btn btn-primary w-full" type="submit">{{T "Send"}}</button>
        <a class="btn btn-ghost w-full" href="/portal/forgot">{{T "Back"}}</a>
      </form>
    </div>
  </div>
</main>
{{end}}
