{{define "body"}}
<main class="grid min-h-screen place-items-center p-4">
  <form class="card w-full max-w-md overflow-hidden" method="post" action="/portal/register">
    <div class="fiber-stripe" aria-hidden="true"></div>
    <div class="card-body space-y-4">
      <h1 class="page-title">{{T "Register"}}</h1>
      {{if .Flash}}<p class="alert alert-ok" role="status">{{icon "circle-check"}}<span>{{.Flash}}</span></p>{{end}}
      {{if .Error}}<p class="alert alert-error" role="alert">{{icon "circle-alert"}}<span>{{T .Error}}</span></p>{{end}}
      {{with .Data}}
      <div><label class="label" for="username">{{T "Username"}}</label><input class="input" id="username" name="username" required value="{{.Username}}"></div>
      <div><label class="label" for="fullname">{{T "Full Name"}}</label><input class="input" id="fullname" name="fullname"{{if .Fname}} required{{end}} value="{{.Fullname}}"></div>
      <div><label class="label" for="email">{{T "Email"}}</label><input class="input" id="email" name="email" type="email"{{if .MEmail}} required{{end}} value="{{.Email}}"></div>
      <div><label class="label" for="address">{{T "Home Address"}}</label><input class="input" id="address" name="address"{{if .MAddress}} required{{end}} value="{{.Address}}"></div>
      {{if .OTP}}<div><label class="label" for="phone_number">{{T "Phone Number"}}</label><input class="input" id="phone_number" name="phone_number" inputmode="tel" required value="{{.Phone}}"></div>{{end}}
      <div><label class="label" for="password">{{T "Password"}}</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" required></div>
      <div><label class="label" for="cpassword">{{T "Confirm Password"}}</label><input class="input" id="cpassword" name="cpassword" type="password" autocomplete="new-password" required></div>
      {{if .OTP}}
      <div><label class="label" for="otp_code">{{T "Verification Code"}}</label><input class="input" id="otp_code" name="otp_code" inputmode="numeric"></div>
      <button class="btn btn-ghost w-full" type="submit" name="send_otp" value="1">{{T "Request OTP"}}</button>
      {{end}}
      {{end}}
      <button class="btn btn-primary w-full" type="submit">{{T "Register"}}</button>
      <a class="btn btn-ghost w-full" href="/portal/login">{{T "Cancel"}}</a>
    </div>
  </form>
</main>
{{end}}
