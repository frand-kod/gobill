{{define "body"}}
<main class="mx-auto max-w-2xl p-4">
  {{with .Data}}
  <article class="card overflow-hidden">
    <div class="fiber-stripe" aria-hidden="true"></div>
    <div class="card-body space-y-4">
      <h1 class="page-title">{{T .Title}}</h1>
      <div class="whitespace-pre-line text-sm">{{.Body}}</div>
    </div>
  </article>
  {{end}}
  <p class="mt-4 text-center"><a class="btn btn-ghost" href="/portal/login">{{T "Sign in"}}</a></p>
</main>
{{end}}
