{{define "body"}}
<main class="grid min-h-screen place-items-center p-4">
  <form class="card w-full max-w-sm overflow-hidden" method="post" action="/login">
    <div class="fiber-stripe" aria-hidden="true"></div>
    <div class="card-body space-y-4">
      <div class="flex items-center gap-2 text-accent-fg">{{template "logoL" .Brand}}<span class="text-lg font-semibold">{{with .Brand.login_page_head}}{{.}}{{else}}NuxBill{{end}}</span></div>
      <h1 class="page-title">{{T "Sign in"}}</h1>
      {{with .Brand.login_page_description}}<p class="text-sm text-ink-2">{{.}}</p>{{end}}
      {{if .Error}}<p class="alert alert-error" role="alert">{{icon "circle-alert"}}<span>{{T .Error}}</span></p>{{end}}
      <div>
        <label class="label" for="username">{{T "Username"}}</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" required autofocus value="{{with .Data}}{{.Username}}{{end}}">
      </div>
      <div>
        <label class="label" for="password">{{T "Password"}}</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-full" type="submit">{{T "Sign in"}}</button>
    </div>
  </form>
</main>
{{end}}
