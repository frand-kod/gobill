{{define "content"}}
{{with .Data}}
<h1>{{T "Settings"}}</h1>
<form class="card form" method="post" action="/admin/settings" novalidate>
  <div class="card-body">
    <div class="field">
      <label for="company_name">{{T "Company name"}}</label>
      <input id="company_name" name="company_name" value="{{.Values.company_name}}" required{{if .Errors.company_name}} aria-invalid="true" aria-describedby="company_name-err"{{end}}>
      {{with .Errors.company_name}}<p class="field-error" id="company_name-err">{{T .}}</p>{{end}}
    </div>
    <div class="field">
      <label for="language">{{T "Language"}}</label>
      <select id="language" name="language"{{if .Errors.language}} aria-invalid="true" aria-describedby="language-err"{{end}}>
        {{$cur := .Values.language}}
        {{range .Languages}}<option value="{{.}}"{{if eq . $cur}} selected{{end}}>{{.}}</option>{{end}}
      </select>
      {{with .Errors.language}}<p class="field-error" id="language-err">{{T .}}</p>{{end}}
    </div>
    <div class="field">
      <label for="timezone">{{T "Timezone"}}</label>
      <input id="timezone" name="timezone" value="{{.Values.timezone}}" required{{if .Errors.timezone}} aria-invalid="true" aria-describedby="timezone-err"{{end}}>
      {{with .Errors.timezone}}<p class="field-error" id="timezone-err">{{T .}}</p>{{end}}
    </div>
    <div class="field">
      <label for="currency_code">{{T "Currency_Code"}}</label>
      <input id="currency_code" name="currency_code" value="{{.Values.currency_code}}" required{{if .Errors.currency_code}} aria-invalid="true" aria-describedby="currency_code-err"{{end}}>
      {{with .Errors.currency_code}}<p class="field-error" id="currency_code-err">{{T .}}</p>{{end}}
    </div>
    <button class="btn btn-primary" type="submit">{{T "Save settings"}}</button>
  </div>
</form>
{{end}}
{{end}}
