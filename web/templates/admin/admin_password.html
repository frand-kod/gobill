{{define "content"}}
{{with .Data}}
<div class="page-head">
  <h1 class="page-title">{{T "Reset password"}}: {{.Username}}</h1>
</div>
<div class="card max-w-xl">
  <div class="card-body space-y-4">
    <p>{{T "New password for this admin. Copy it now: it is shown only once."}}</p>
    <div class="flex flex-wrap gap-2">
      <input id="new-pw" class="input min-w-0 flex-1 font-mono" type="password" readonly value="{{.Password}}" aria-label="{{T "New password"}}" onfocus="this.select()">
      <button class="btn" type="button" id="new-pw-toggle" aria-controls="new-pw" data-show="{{T "Show"}}" data-hide="{{T "Hide"}}">{{T "Show"}}</button>
      <button class="btn" type="button" id="new-pw-copy" data-copied="{{T "Copied"}}">{{T "Copy"}}</button>
    </div>
    <span id="new-pw-status" class="text-sm text-ok-fg" role="status" aria-live="polite"></span>
    <script>
    (function () {
      var pw = document.getElementById('new-pw'), tog = document.getElementById('new-pw-toggle'), cp = document.getElementById('new-pw-copy'), st = document.getElementById('new-pw-status');
      tog.addEventListener('click', function () {
        var shown = pw.type === 'text';
        pw.type = shown ? 'password' : 'text';
        tog.textContent = shown ? tog.dataset.show : tog.dataset.hide;
        tog.setAttribute('aria-pressed', shown ? 'false' : 'true');
      });
      cp.addEventListener('click', function () {
        pw.select();
        // the Clipboard API needs https or localhost; over plain http the selection is copied with execCommand
        if (!navigator.clipboard) { if (document.execCommand('copy')) { st.textContent = cp.dataset.copied; } return; }
        navigator.clipboard.writeText(pw.value).then(function () { st.textContent = cp.dataset.copied; }, function () {});
      });
    })();
    </script>
    <p class="text-sm text-ink-2">{{T "The admin is signed out everywhere and must log in with this password."}}</p>
    <a class="btn btn-ghost" href="{{.Back}}">{{T "Back"}}</a>
  </div>
</div>
{{end}}
{{end}}
