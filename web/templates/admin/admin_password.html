{{define "content"}}
{{with .Data}}
<div class="page-head">
  <h1 class="page-title">{{T "Reset password"}}: {{.Username}}</h1>
</div>
<div class="card max-w-xl">
  <div class="card-body space-y-4">
    <p>{{T "New password for this admin. Copy it now: it is shown only once."}}</p>
    <div class="flex flex-wrap gap-2">
      <input id="new-pw" class="input min-w-0 flex-1 font-mono" type="text" readonly value="{{.Password}}" aria-label="{{T "New password"}}" onfocus="this.select()">
      <button class="btn" type="button" onclick="var i=document.getElementById('new-pw');i.select();if(navigator.clipboard){navigator.clipboard.writeText(i.value)}">{{T "Copy"}}</button>
    </div>
    <p class="text-sm text-ink-2">{{T "The admin is signed out everywhere and must log in with this password."}}</p>
    <a class="btn btn-ghost" href="{{.Back}}">{{T "Back"}}</a>
  </div>
</div>
{{end}}
{{end}}
