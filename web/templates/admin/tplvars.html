{{define "tplvars"}}
{{/* Variables of a message text box: each name is a button that inserts [[name]] at the cursor (static/tplvars.js). */}}
<dl class="hint mt-2 grid grid-cols-[auto_1fr] items-baseline gap-x-3 gap-y-1">
  {{range .Vars}}<dt><button type="button" class="-mx-1.5 rounded px-1.5 py-1 font-mono text-xs text-ink hover:text-accent-fg hover:underline" data-var-target="{{$.Name}}" data-var-insert="[[{{.Name}}]]" aria-label="{{T "Insert"}} [[{{.Name}}]]">[[{{.Name}}]]</button></dt><dd>{{T .Desc}}</dd>{{end}}
</dl>
{{end}}
