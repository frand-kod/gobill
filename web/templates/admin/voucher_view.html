{{define "content"}}
{{with .Data}}
<div class="mb-4"><h1 class="page-title">{{T "Voucher"}}: {{.Plan}}</h1></div>
<div class="card">
  <div class="card-body space-y-4">
    <label class="label" for="codes">{{T "Code Voucher"}} ({{.Count}})</label>
    <textarea class="input font-mono" id="codes" rows="12" readonly>{{.Codes}}</textarea>
    <div class="flex flex-wrap gap-2">
      <a class="btn btn-primary" href="{{.PrintURL}}">{{T "Print"}}</a>
      <a class="btn btn-ghost" href="/admin/vouchers">{{T "Finish"}}</a>
    </div>
  </div>
</div>
{{end}}
{{end}}
