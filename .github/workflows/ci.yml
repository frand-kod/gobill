name: ci
on: [push, pull_request]

jobs:
  # Tags skip checks, test and build: the tagged commit was already tested on main, and the
  # release job waits for that run instead of repeating it.
  checks:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: app.css is up to date
        run: |
          sh tools/tailwind.sh
          git diff --exit-code web/static/app.css
      - name: THIRD_PARTY_LICENSES.txt is up to date
        run: |
          sh tools/third-party.sh
          git diff --exit-code THIRD_PARTY_LICENSES.txt
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  # internal/web runs its tests one after another and takes most of the time, so its tests
  # are split over four shards by name; shard 0 also runs every other package.
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Other packages
        if: matrix.shard == 0
        run: go test -race -timeout 30m $(go list ./... | grep -v '/internal/web$')
      - name: internal/web shard ${{ matrix.shard }}
        run: |
          tests=$(go test -list '^(Test|Fuzz)' ./internal/web | grep -E '^(Test|Fuzz)' | awk -v n=4 -v k=${{ matrix.shard }} 'NR % n == k' | paste -sd '|')
          go test -race -timeout 30m -run "^($tests)\$" ./internal/web

  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [checks, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: arm, goarm: "7"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" -o dist/gobill-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && 'v' }}${{ matrix.goarm }} ./cmd/gobill
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
      - uses: actions/upload-artifact@v4
        with:
          name: gobill-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && 'v' }}${{ matrix.goarm }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Tagged commit passed CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The main push usually lands together with the tag, so wait for its run (up to 45 min).
          for i in $(seq 90); do
            r=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --json headBranch,status,conclusion \
              -q '[.[] | select(.headBranch == "main")][0] | "\(.status) \(.conclusion)"')
            case "$r" in
              "completed success") exit 0 ;;
              completed*) echo "CI on main for $GITHUB_SHA: $r"; exit 1 ;;
            esac
            sleep 30
          done
          echo "no finished CI run on main for $GITHUB_SHA; push main before the tag"; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A release built without the key could never verify the next one: `gobill update` would refuse everything.
      - name: Release public key is set
        run: go run ./tools/releasesign check-key
      - name: Cross-build
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o dist/gobill-linux-amd64 ./cmd/gobill
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o dist/gobill-linux-arm64 ./cmd/gobill
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o dist/gobill-linux-armv7 ./cmd/gobill
          cd dist && sha256sum gobill-linux-* > SHA256SUMS && cp SHA256SUMS sha256sums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Notes are the CHANGELOG section of this version. The release stays a draft, hidden from
          # `gobill update`, until the maintainer signs SHA256SUMS offline and publishes it: make sign TAG=$TAG
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file notes.md --draft
          gh release upload "$TAG" dist/* --clobber
